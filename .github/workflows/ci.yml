# Tests à chaque push. test_sources_reelles.py appelle vraiment istqb.org :
# ignoré avec sa raison (-rs) si le site bloque le runner.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mcp.txt
      # Le SDK MCP (optionnel, #153) n'est installé qu'ici : les tests du dialogue MCP
      # réel tournent dans ce job et s'ignorent ailleurs.
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-mcp.txt
      # CLI Claude Code, sans compte : `claude plugin validate --strict plugin` est lancé par
      # tests/test_plugin.py (#184), ignoré ailleurs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claude Code (validation du plugin)
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Syntaxe
        run: python -m compileall -q qak qa.py
      - name: Tests
        run: python -m pytest tests/ -q -rs
      # L'index n'est pas versionné : on vérifie que les PDF du dépôt s'indexent
      # sans échec et que la recherche tient son niveau sur le jeu de contrôle
      # (rappel@5 ≥ 80 % : sinon rc=2 et la CI échoue).
      - name: Indexation de la bibliothèque + évaluation
        run: |
          python qa.py actualiser
          python qa.py inventaire
          python qa.py evaluer --jeu controle --min-rappel 0.80

  # Windows : encodages de la console (cp1252), chemins, verrous de fichiers.
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/ -q -rs

  # Issue #73 : installation depuis un clone propre, comme un utilisateur (venv,
  # dépendances, indexation, diagnostic OK/KO dont la recherche témoin).
  # Issue #203 : le plugin sous Windows, sans Git Bash. Claude Code résout la commande MCP
  # `${CLAUDE_PLUGIN_ROOT}/bin/qa` vers `bin/qa.cmd` ; on vérifie que le serveur démarre et
  # répond (tools/list par le SDK, puis `claude mcp list`, sans compte Claude).
  plugin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mcp.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-mcp.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code; claude --version
      - name: Tests du plugin (lanceur qa.cmd, tools/list, claude plugin validate)
        run: python -m pytest tests/test_plugin.py tests/test_integrations.py -q -rs
      - name: Git Bash retiré (cas d'un poste Windows sans Git)
        shell: pwsh
        run: |
          foreach ($f in "C:\Program Files\Git\bin\bash.exe", "C:\Program Files\Git\bin\sh.exe",
                         "C:\Program Files\Git\usr\bin\bash.exe", "C:\Program Files\Git\usr\bin\sh.exe") {
            if (Test-Path $f) { Rename-Item $f "$f.retire" }
          }
      - name: Serveur MCP du plugin démarré par Claude Code
        shell: pwsh
        run: |
          claude plugin marketplace add "$env:GITHUB_WORKSPACE/plugin"
          claude plugin install istqbfinder@istqbfinder-local
          $sortie = claude mcp list | Out-String
          Write-Output $sortie
          if ($sortie -notmatch "plugin:istqbfinder:istqbfinder: .*bin/qa mcp - .*Connected") {
            Write-Error "Le serveur MCP du plugin ne démarre pas sous Windows."; exit 1
          }

  installation-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # version minimale annoncée
      - name: installer.sh (première installation)
        run: ./installer.sh --assistant tous
      - name: installer.sh, relancé (idempotence)
        run: ./installer.sh
      - name: Rien de versionné n'a changé
        run: git status --porcelain && test -z "$(git status --porcelain)"

  installation-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: installer.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\installer.ps1 -Assistant tous
